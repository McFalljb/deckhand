<!doctype html>
<html><head><meta charset="utf-8"><title>Recipe Box</title>
<style>
body { margin: 0; font: 15px -apple-system, system-ui, sans-serif; background: #faf7f2; color: #2b2622; }
header { padding: 18px 28px; background: #c2593b; color: #fff; font-size: 20px; font-weight: 600; }
main { padding: 24px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.card h2 { margin: 0 0 6px; font-size: 16px; } .card p { margin: 0; color: #7a6f66; font-size: 13px; }
button { margin: 0 28px; padding: 8px 14px; border: 0; border-radius: 6px; background: #2b2622; color: #fff; font-size: 14px; }
</style></head>
<body><header>Recipe Box</header>
<p style="margin: 18px 28px 0"><button>Import CSV…</button></p>
<main>
<div class="card"><h2>Shakshuka</h2><p>Eggs, tomatoes, peppers · 30 min</p></div>
<div class="card"><h2>Lemon risotto</h2><p>Arborio, lemon, parmesan · 40 min</p></div>
<div class="card"><h2>Miso salmon</h2><p>Salmon, white miso, rice · 25 min</p></div>
<div class="card"><h2>Pasta e ceci</h2><p>Chickpeas, ditalini, rosemary · 35 min</p></div>
</main></body></html>
