# Every push to main and every pull request: unit tests and the required test-mode scenes, in
# parallel jobs so the run takes a few minutes. The slow and not-yet-required scenes run in
# scenes-full.yml (nightly and on demand).
#
# Test-mode scenes: fake HOME, fake pi, temp data dir, no network, never real pi.
# NEVER in CI: bridge-e2e.sh, home-e2e.sh, text-pi.sh and LOOKS_PI=real looks.sh run a real pi
# against paid models.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ODIN_VERSION: dev-2026-09
  # sha256 of odin-macos-arm64-dev-2026-09.tar.gz (the release asset). Update with ODIN_VERSION.
  ODIN_SHA256: 3e6cbc1f247d8d14fe02c3151272d0a5b8d6d77acb7219f5b62914e4d95d97f7
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  unit:
    runs-on: macos-15 # arm64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { cef: "false" }
      - name: Unit and binding tests
        run: ./build.sh test

  # Required scenes, split so each shard takes about the same time (timings from the hosted
  # runner: menus ~100 s, jobs ~80 s, the rest under 30 s each). Promote a scene from
  # scenes-full.yml once it has passed there a few times.
  scenes:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - menus fetch-cef-test projects
          - jobs markdown restore term-links
          - settings setup menu
    name: scenes (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
      - name: Build (with CEF)
        run: ./build.sh
      - name: Scenes
        run: |
          fail=0
          for s in ${{ matrix.shard }}; do
            echo "::group::$s"
            if ! tests/scripts/$s.sh; then echo "::error::scene $s failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
      - name: Upload screenshots and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-output-${{ strategy.job-index }}
          path: |
            build/shots
            build/**/*.log
          if-no-files-found: ignore
