# Every test-mode scene, nightly and on demand: tiers required and full in tests/scenes.txt (CEF
# and app-tab scenes on the runner's virtual GPU, large-folder and many-file timings). Failures
# of the not-yet-required (full) scenes are warnings and never fail the run; a required one fails
# it. Also the required scenes with the core in the window's process (--in-process), nightly and
# on every push to main (pull requests run only the default, a separate core: ci.yml). What runs
# where and why: docs/TESTING.md.
#
# NEVER here: bridge-e2e.sh, home-e2e.sh, text-pi.sh and LOOKS_PI=real looks.sh (real pi, paid
# models; tier "paid", which tests/scenes.py refuses). Left out as well: the manual tier
# (screenshot and benchmark tools: looks, font, shots, text-shots, persist-cpu, ...) and scenes
# tagged noci (browser-netpolicy: which hosts Chromium tries during a 20 s idle).
name: Scenes (full)

on:
  # the in-process scenes only (the other jobs skip a push); the same paths as ci.yml
  push:
    branches: [main]
    paths: ["**", "!**.md", "!docs/**", "!LICENSE", "docs/GUIDE.md", "docs/PROTOCOL.md"]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenes-full-${{ github.event_name }}
  cancel-in-progress: true

env:
  ODIN_VERSION: dev-2026-09
  ODIN_SHA256: 3e6cbc1f247d8d14fe02c3151272d0a5b8d6d77acb7219f5b62914e4d95d97f7
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  # The time budgets at their own limits (tests/unit.py --perf-strict): a report, never failing the
  # run (merges gate on ./build.sh test, where a budget fails only past 10x or 3x)
  perf:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { cef: "false" }
      - name: Time budgets, strict (a report)
        run: python3 tests/unit.py --timing-only --perf-strict || echo "::warning::time budgets over their limits (see the log)"

  scenes:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: scenes (${{ matrix.shard }}/4)
    env:
      SCENE_JOBS: "2"
      # a scene is killed after this many times its typical (dev Mac) time, at least 120 s
      SCENE_TIMEOUT_X: "5"
      # inside the job's 45 min (setup and the build come first): the summary always comes out
      SCENE_MAX_MINUTES: "32"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
      - name: Build (with CEF) and the fake app
        run: ./build.sh && ./build.sh fake-app
      - name: Which scenes
        run: python3 tests/scenes.py --all --ci --shard ${{ matrix.shard }}/4 --list
      - name: Scenes
        id: scenes
        run: python3 tests/scenes.py --all --ci --shard ${{ matrix.shard }}/4 --no-build --soft-tier full
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-output-${{ matrix.shard }}
          path: |
            build/scenes
            build/shots
            build/**/*.log
          if-no-files-found: ignore

  # The required scenes with the core in the window's process (DECKHAND_SEPARATE_CORE=0, still a
  # setting): after the merge, so pull requests wait only for the default's run (ci.yml)
  scenes-in-process:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: scenes in-process (${{ matrix.shard }}/2)
    env:
      SCENE_JOBS: "2"
      SCENE_TIMEOUT_X: "5"
      SCENE_MAX_MINUTES: "14"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
      - name: Build (with CEF) and the fake app
        run: ./build.sh && ./build.sh fake-app
      - name: Which scenes
        run: python3 tests/scenes.py --required --ci --in-process --shard ${{ matrix.shard }}/2 --list
      - name: Scenes
        run: python3 tests/scenes.py --required --ci --in-process --shard ${{ matrix.shard }}/2 --no-build
      - name: Upload screenshots and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-output-in-process-${{ matrix.shard }}
          path: |
            build/scenes
            build/shots
            build/**/*.log
          if-no-files-found: ignore
