<!doctype html>
<!-- A big visibility:hidden mega-menu before the article (tests/scripts/browser-read.txt): its
     ~90 000 hidden nodes are walked on their own budget, so the article after them is read whole
     (no "[stopped"). Served as deckhand-test://web/read-big.html (no network). -->
<html><head><meta charset="utf-8"><title>Read big fixture</title>
<style>html, body { margin: 0; background: #ffffff; font: 16px -apple-system, sans-serif; } #menu { visibility: hidden; position: absolute; }</style></head>
<body>
<nav id="menu"></nav>
<main><h1>Big page</h1><p>Main article big.</p></main>
<script>
  const menu = document.getElementById('menu');
  let html = '';
  for (let i = 0; i < 2000; i++) {
    html += '<ul>';
    for (let j = 0; j < 15; j++) html += '<li><a href="#x">menu-item</a></li>';
    html += '</ul>';
  }
  menu.innerHTML = html;
</script>
</body></html>
