# Every test-mode scene, nightly and on demand: tiers required and full in tests/scenes.txt (CEF
# and app-tab scenes on the runner's virtual GPU, large-folder and many-file timings). Failures
# of the not-yet-required (full) scenes are warnings and never fail the run; a required one fails
# it. What runs where and why: docs/TESTING.md.
#
# NEVER here: bridge-e2e.sh, home-e2e.sh, text-pi.sh and LOOKS_PI=real looks.sh (real pi, paid
# models; tier "paid", which tests/scenes.py refuses). Left out as well: the manual tier
# (screenshot and benchmark tools: looks, font, shots, text-shots, persist-cpu, ...) and scenes
# tagged noci (browser-netpolicy: which hosts Chromium tries during a 20 s idle).
name: Scenes (full)

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenes-full
  cancel-in-progress: true

env:
  ODIN_VERSION: dev-2026-09
  ODIN_SHA256: 3e6cbc1f247d8d14fe02c3151272d0a5b8d6d77acb7219f5b62914e4d95d97f7
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  scenes:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: scenes (${{ matrix.shard }}/4)
    env:
      SCENE_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
      - name: Build (with CEF) and the fake app
        run: ./build.sh && ./build.sh fake-app
      - name: Which scenes
        run: python3 tests/scenes.py --all --ci --shard ${{ matrix.shard }}/4 --list
      - name: Scenes
        id: scenes
        run: python3 tests/scenes.py --all --ci --shard ${{ matrix.shard }}/4 --no-build --soft-tier full
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-output-${{ matrix.shard }}
          path: |
            build/scenes
            build/shots
            build/**/*.log
          if-no-files-found: ignore
