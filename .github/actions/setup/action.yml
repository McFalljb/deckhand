# Shared setup for the CI jobs: pinned, checksummed Odin and the cached CEF download.
name: setup
description: Odin (pinned, checksummed) and the CEF cache
inputs:
  cef:
    description: restore the CEF cache (jobs that build the app)
    default: "true"
runs:
  using: composite
  steps:
    # The release tarball is cached by version and checksum (GitHub's release downloads sometimes
    # answer 504) and checked against ODIN_SHA256 on every run, cached or not
    - name: Cache Odin
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/odin-dl
        key: odin-${{ runner.os }}-arm64-${{ env.ODIN_VERSION }}-${{ env.ODIN_SHA256 }}

    - name: Odin (pinned, checksummed)
      shell: bash
      run: |
        dl="$RUNNER_TEMP/odin-dl/odin.tar.gz"
        if [ ! -f "$dl" ]; then
          mkdir -p "$RUNNER_TEMP/odin-dl"
          # asset name checked for dev-2026-09; check it again when bumping ODIN_VERSION
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$dl" \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-macos-arm64-${ODIN_VERSION}.tar.gz"
        fi
        echo "${ODIN_SHA256}  $dl" | shasum -a 256 -c
        mkdir -p "$RUNNER_TEMP/odin"
        tar -xzf "$dl" -C "$RUNNER_TEMP/odin" --strip-components 1
        echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/odin/odin" version

    - name: Cache CEF
      if: inputs.cef == 'true'
      uses: actions/cache@v4
      with:
        # scripts/fetch-cef.sh keeps the archive in downloads/ and the unpacked tree beside it,
        # and re-checks the archive's SHA-256 before reusing a cached tree
        path: ~/Library/Caches/deckhand/cef
        key: cef-${{ runner.os }}-arm64-${{ hashFiles('vendor/cef/VERSION') }}

    - name: Git identity for scenes that make commits
      shell: bash
      run: |
        git config --global user.name "CI"
        git config --global user.email "ci@example.invalid"
        git config --global init.defaultBranch main
