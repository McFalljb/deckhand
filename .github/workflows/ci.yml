# Every push to main and every pull request: unit tests and the required test-mode scenes (the
# default, separate core), in parallel jobs so the run takes a few minutes. The slow and not-yet-required scenes run in
# scenes-full.yml (nightly and on demand). What runs where and why: docs/TESTING.md.
#
# Test-mode scenes: fake HOME, fake pi, temp data dir, no network, never real pi.
# NEVER in CI: bridge-e2e.sh, home-e2e.sh, text-pi.sh and LOOKS_PI=real looks.sh run a real pi
# against paid models (tests/scenes.py refuses them: tier "paid" in tests/scenes.txt).
name: CI

# Not for Markdown and docs alone, except the two docs the build reads: docs/GUIDE.md is built
# into the binary (Atlas's guide, the Help menu) and src/docs_test.odin checks it and
# docs/PROTOCOL.md list every action and command.
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!docs/**", "!LICENSE", "docs/GUIDE.md", "docs/PROTOCOL.md"]
  pull_request:
    paths: ["**", "!**.md", "!docs/**", "!LICENSE", "docs/GUIDE.md", "docs/PROTOCOL.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ODIN_VERSION: dev-2026-09
  # sha256 of odin-macos-arm64-dev-2026-09.tar.gz (the release asset). Update with ODIN_VERSION.
  ODIN_SHA256: 3e6cbc1f247d8d14fe02c3151272d0a5b8d6d77acb7219f5b62914e4d95d97f7
  # and of odin-linux-amd64-dev-2026-09.tar.gz (the linux job)
  ODIN_SHA256_LINUX: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  # The session holder's code changed only with a holder_rev bump (docs/plans/background-core.md
  # §7.3): running holders upgrade only to a newer holder_rev. Git only, no build.
  holder-rev:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: holder_rev bumped if the holder changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: scripts/check-holder-rev.sh "$BASE"

  # The core and the holder link no window code (docs/plans/background-core.md §10.2): fails in
  # seconds, before the macOS jobs finish. ./build.sh test runs it too.
  core-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: No window imports in src/core or src/holder; the M2-B verifier refuses what it must
        run: scripts/check-core-boundary.sh && sh tests/check-core-boundary-test.sh && sh tests/core-move-verify-test.sh

  unit:
    runs-on: macos-15 # arm64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { cef: "false" }
      - name: Unit and binding tests
        run: ./build.sh test

  # The core on Linux, without the session holder (docs/plans/background-core.md §10.4 M6-L1):
  # it builds, its wires', trust rules' and portable unit tests pass, and it serves
  # (tests/linux-core-smoke.py). ./build.sh test type-checks the same packages on a Mac.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { cef: "false" }
      - name: Build the core
        run: mkdir -p build && odin build src/coremain -out:build/deckhand-core-serve -o:speed
      - name: Wire and trust tests
        run: |
          odin test src/holderwire -out:build/holderwire-tests
          odin test src/corewire -out:build/corewire-tests
          odin test src/trust -out:build/trust-tests
      - name: The core's unit tests
        run: TMPDIR="$RUNNER_TEMP" odin test src/core -out:build/deckhand-core-unit-tests -define:ODIN_TEST_THREADS=1 -define:DECKHAND_UPDATE_TEST=true
      - name: The core serves
        run: python3 tests/linux-core-smoke.py build/deckhand-core-serve
      - name: The core serves from the default dirs (~/.local/state/deckhand/run)
        run: python3 tests/linux-core-smoke.py --default-dirs build/deckhand-core-serve
      - name: The systemd user unit (install, verify; then on demand from connect under the runner's own user manager)
        run: tests/linux-systemd-check.sh --real build/deckhand-core-serve

  # The required scenes (tier "required" in tests/scenes.txt) with the app's default, a separate
  # core: four shards balanced by their typical times, two scenes at a time on each runner
  # (tests/scenes.py; SCENE_JOBS: 1 runs them one at a time). A failed scene is retried once; one
  # that then passes is reported as flaky (a warning) and does not fail the run. Promote a scene
  # from scenes-full.yml by setting its tier to required once it has passed there a few times.
  # The same scenes with the core in the window's process (--in-process) run after the merge, on
  # main and nightly: scenes-full.yml.
  scenes:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: scenes (${{ matrix.shard }}/4)
    env:
      SCENE_JOBS: "2"
      # a scene is killed after this many times its typical (dev Mac) time, at least 120 s
      SCENE_TIMEOUT_X: "5"
      # the scenes' own budget, inside the job's 20 min (setup and the build come first): past it no
      # scene starts and running ones are killed, so the summary and the logs always come out
      SCENE_MAX_MINUTES: "10"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/setup
      - name: Build (with CEF)
        run: ./build.sh && ./build.sh fake-app
      - name: Which scenes
        run: python3 tests/scenes.py --required --ci --shard ${{ matrix.shard }}/4 --list
      - name: Scenes
        run: python3 tests/scenes.py --required --ci --shard ${{ matrix.shard }}/4 --no-build
      - name: Upload screenshots and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-output-${{ matrix.shard }}
          path: |
            build/scenes
            build/shots
            build/**/*.log
          if-no-files-found: ignore
